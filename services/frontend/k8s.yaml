apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextgen-ui
  labels:
    app: nextgen-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextgen-ui
  template:
    metadata:
      labels:
        app: nextgen-ui
    spec:
      containers:
        - name: nextgen-ui
          image: docker.io/suryadasari31/nextgen-frontend:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 9080

---
apiVersion: v1
kind: Service
metadata:
  name: nextgen-ui
spec:
  selector:
    app: nextgen-ui
  ports:
    - name: http
      port: 9080
      targetPort: 9080
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextgen-ui
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: nextgen.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nextgen-ui
                port:
                  number: 9080
