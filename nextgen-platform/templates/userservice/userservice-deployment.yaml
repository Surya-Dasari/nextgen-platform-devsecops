apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: userservice
  template:
    metadata:
      labels:
        app: userservice
    spec:
      containers:
        - name: userservice
          image: {{ .Values.userservice.image }}:{{ .Values.userservice.tag }}
          ports:
            - containerPort: 9002

          env:
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.userservice.env.SPRING_DATASOURCE_URL }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.userservice.env.SPRING_DATASOURCE_USERNAME }}
            - name: SPRING_DATASOURCE_PASSWORD
              value: {{ .Values.userservice.env.SPRING_DATASOURCE_PASSWORD }}
