apiVersion: apps/v1
kind: Deployment
metadata:
  name: apiservice
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apiservice
  template:
    metadata:
      labels:
        app: apiservice
    spec:
      containers:
        - name: apiservice
          image: quay.io/suryadasari31/nextgen-apiservice:latest
          ports:
            - containerPort: 8080
